services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ingst
      POSTGRES_USER: ingst
      POSTGRES_PASSWORD: ingst
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ingst -d ingst"]
      interval: 2s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
